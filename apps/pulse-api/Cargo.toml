[package]
name = "pulse-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
pulse-core = { path = "../../libs/pulse-core" }
# aws_lc_rs: jsonwebtoken 10 needs an explicit backend; reuse the one rustls already pulls in.
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.6", features = ["trace"] }
subtle = "2"
rand = "0.10"
urlencoding = "2"
rss = "2"
atom_syndication = "0.12"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
http-body-util = "0.1"
