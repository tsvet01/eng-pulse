name: Pilot history import

on:
  workflow_dispatch:
    inputs:
      expected_api_revision:
        description: 'Full commit SHA of the deployed API with import-history support'
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s scripts/tests -v

  import:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: { group: deploy-api-main, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the expected deployed revision
        env:
          EXPECTED_API_REVISION: ${{ inputs.expected_api_revision }}
        run: bash scripts/import-pilot-history.sh --check-inputs
      - name: Load reviewed import script
        run: |
          { echo 'FILE_PILOT_HISTORY<<PULSE_SCRIPT_EOF'; cat scripts/import-pilot-history.sh; echo PULSE_SCRIPT_EOF; } >> "$GITHUB_ENV"
      - name: Import and verify existing published briefs
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          EXPECTED_API_REVISION: ${{ inputs.expected_api_revision }}
        with:
          host: api.eng-pulse.tsvetkov.org
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: EXPECTED_API_REVISION,FILE_PILOT_HISTORY
          command_timeout: 5m
          script: |
            set -eu
            cd /opt/pulse
            bash -c "$FILE_PILOT_HISTORY" </dev/null
