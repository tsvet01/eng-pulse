version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/apps/daily-agent, /apps/explorer-agent, /apps/pulse-api]
    schedule: { interval: monthly }
    groups:
      docker: { patterns: ["*"] }

  - package-ecosystem: docker-compose
    directory: /infra/hetzner/files
    schedule: { interval: monthly }

  - package-ecosystem: terraform
    directory: /infra/hetzner
    schedule: { interval: monthly }

  - package-ecosystem: pip
    directories: [/functions/notifier, /functions/apns-notifier, /functions/fcm-tokens, /functions/feedback-receiver, /functions/shared]
    schedule: { interval: monthly }
    groups:
      pip: { patterns: ["*"] }
